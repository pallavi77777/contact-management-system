<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Contact Management System</h1>
      <p>Manage your contacts easily</p>
    </header>

    <section class="card">
      <h2 id="formTitle">Add Contact</h2>
      <form id="contactForm">
        <input type="hidden" id="editIndex">

        <div class="form-grid">
          <div>
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Enter name" required>
          </div>

          <div>
            <label for="phone">Phone</label>
            <input type="tel" id="phone" placeholder="Enter phone number" required>
          </div>

          <div>
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter email">
          </div>

          <div>
            <label for="address">Address</label>
            <input type="text" id="address" placeholder="Enter address">
          </div>
        </div>

        <button type="submit" id="submitBtn">Add Contact</button>
        <button type="button" id="cancelBtn" class="secondary hidden">Cancel</button>
      </form>
    </section>

    <section class="card">
      <div class="list-header">
        <h2>Contacts (<span id="contactCount">0</span>)</h2>
        <input type="search" id="search" placeholder="Search contacts...">
      </div>

      <div id="contactList" class="contact-list"></div>
      <p id="emptyMessage" class="empty">No contacts found.</p>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
